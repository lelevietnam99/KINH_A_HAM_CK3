<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đề Cương Ôn Tập Kinh A Hàm</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .container {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
            margin-bottom: 40px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 15px;
            display: inline-block;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            display: block;
            text-decoration: none;
            background-color: #3498db;
            color: #ffffff;
            padding: 18px 30px;
            font-size: 1.2em;
            font-weight: bold;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
        }

        .menu-btn:hover {
            background-color: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(41, 128, 185, 0.4);
        }

        /* Nút tự luận đổi màu chút cho dễ phân biệt */
        .btn-tuluan {
            background-color: #27ae60;
            box-shadow: 0 4px 6px rgba(39, 174, 96, 0.3);
        }

        .btn-tuluan:hover {
            background-color: #2ecc71;
            box-shadow: 0 6px 12px rgba(46, 204, 113, 0.4);
        }
        
        .footer-note {
            margin-top: 30px;
            font-size: 0.9em;
            color: #95a5a6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ĐỀ CƯƠNG ÔN TẬP<br>KINH A HÀM CUỐI KÌ</h1>
        <div class="subtitle">GỒM 2 PHẦN : TRẮC NGHIỆM VÀ TỰ LUẬN</div>
        
        <div class="menu-options">
            <a href="tl.html" class="menu-btn btn-tuluan">📝 PHẦN TỰ LUẬN</a>
            <a href="tn.html" class="menu-btn">✅ PHẦN TRẮC NGHIỆM</a>
        </div>

        <div class="footer-note">
            Chúc bạn ôn tập thật tốt và đạt kết quả cao!
        </div>
    </div>

</body>
</html>
