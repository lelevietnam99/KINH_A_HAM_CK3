    <h1>ĐỀ ÔN TẬP KINH TĂNG NHẤT A HÀM<br><small>(Trắc Nghiệm)</small></h1>

    <div id="quiz-container"></div>

                question: 'Câu 150: Theo sự chỉ dạy của Đức Phật, khi một niệm "Thọ" (Cảm thọ) sinh khởi, nếu hành giả không có Chánh niệm tham dự vào để chặn lại, nó sẽ lập tức trôi dạt và sinh ra chi pháp nào tiếp theo, kéo theo sự luân hồi sinh tử?',
                options: ['A. Sinh ra Lão, Tử.', 'B. Sinh ra Ái (Tham ái/ Luyến ái).', 'C. Sinh ra Danh Sắc.', 'D. Sinh ra Lục nhập.'],

                explanation: 'Theo thuyết 12 nhân duyên, ngay khi "Thọ" (cảm giác vui, buồn, trơ trơ) sinh khởi, nếu thiếu chánh niệm chặn lại, nó sẽ tự động trượt dài và sinh ra "Ái" (sự dính mắc, khao khát, luyến ái), từ đó kéo theo chuỗi luân hồi đau khổ. '
            }
        ];

        const container = document.getElementById('quiz-container');

        quizData.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = item.id;

            let optionsHtml = '';
            item.options.forEach(opt => {
                const value = opt.charAt(0);
                optionsHtml += `
                    <label class="option">
                        <input type="radio" name="${item.id}" value="${value}"> ${opt}
                    </label>
                `;
            });

            card.innerHTML = `
                <div class="question-title">${item.question}</div>
                <div class="options">${optionsHtml}</div>
                <button onclick="checkAnswer('${item.id}', '${item.correct}')">Kiểm tra đáp án</button>
                <div class="explanation">
                    <strong>Đáp án đúng: ${item.correct}</strong><br>${item.explanation}
                </div>
            `;
            container.appendChild(card);
        });

        function checkAnswer(qId, correctValue) {
            const selected = document.querySelector(`input[name="${qId}"]:checked`);
            const explanation = document.querySelector(`#${qId} .explanation`);
            const labels = document.querySelectorAll(`#${qId} .option`);

            if (!selected) {
                alert("Bạn vui lòng chọn một đáp án trước khi kiểm tra nhé!");
                return;
            }

            // Vô hiệu hóa lựa chọn và nút bấm sau khi đã kiểm tra
            document.querySelectorAll(`#${qId} input`).forEach(input => input.disabled = true);
            document.querySelector(`#${qId} button`).disabled = true;

            labels.forEach(label => {
                const input = label.querySelector('input');
                if (input.value === correctValue) {
                    label.classList.add('correct'); // Bôi xanh đáp án đúng
                } else if (input.checked && input.value !== correctValue) {
                    label.classList.add('incorrect'); // Bôi đỏ nếu chọn sai
                }
            });

            // Hiện giải thích
            explanation.style.display = 'block';
        }
    </script>
